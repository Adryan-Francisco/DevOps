<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Pedidos</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <nav>
        <div class="nav-container">
            <div class="logo">Sistema DevOps</div>
            <ul class="nav-links">
                <li><a href="/home">Início</a></li>
                <li><a href="/produto/listar">Produtos</a></li>
                <li><a href="/pedido/listar">Pedidos</a></li>
            </ul>
        </div>
    </nav>
    <div class="page-header">
        <h1>Pedidos</h1>
        <p>Acompanhe os pedidos cadastrados</p>
    </div>
    <div class="container">
        <div class="alerta" th:if="${mensagem}" th:text="${mensagem}"></div>
        <div class="alerta" th:if="${erro}" th:text="${erro}"></div>
        <div class="table-container">
            <div class="table-header">
                <h2>Lista de Pedidos</h2><a class="btn btn-primary" href="/pedido/formulario">Novo Pedido</a>
            </div>
            <div style="overflow-x:auto">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Aluno</th>
                            <th>RA</th>
                            <th>Itens</th>
                            <th>Data</th>
                            <th>Status</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pedido : ${pedidos}">
                            <td th:text="${pedido.idPedido}"></td>
                            <td th:text="${pedido.aluno != null ? pedido.aluno.nomeAluno : pedido.nomeCliente}"></td>
                            <td th:text="${pedido.aluno != null ? pedido.aluno.raAluno : '-'}"></td>
                            <td th:text="${#lists.size(pedido.itens)}"></td>
                            <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy')}"></td>
                            <td th:text="${pedido.status}"></td>
                            <td th:text="${#numbers.formatCurrency(pedido.valorTotal)}"></td>
                            <td>
                                <div class="acoes"><a class="btn btn-small btn-success"
                                        th:href="@{/item-pedido/listar/{id}(id=${pedido.idPedido})}">Itens</a><a
                                        class="btn btn-small btn-info"
                                        th:href="@{/pedido/editar/{id}(id=${pedido.idPedido})}">Editar</a><a
                                        class="btn btn-small btn-danger"
                                        th:href="@{/pedido/deletar/{id}(id=${pedido.idPedido})}"
                                        onclick="return confirm('Tem certeza que deseja deletar?')">Deletar</a></div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pedidos)}">
                            <td colspan="8">Nenhum pedido cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
