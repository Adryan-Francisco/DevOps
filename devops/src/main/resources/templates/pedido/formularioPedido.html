<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido</title><link rel="stylesheet" href="/css/styles.css"></head><body>
<nav><div class="nav-container"><div class="logo">Sistema DevOps</div><ul class="nav-links"><li><a href="/home">Início</a></li><li><a href="/produto/listar">Produtos</a></li><li><a href="/pedido/listar">Pedidos</a></li></ul></div></nav>
<div class="page-header"><h1 th:text="${pedido.idPedido == null ? 'Novo Pedido' : 'Editar Pedido'}"></h1><p>Preencha os dados gerais do pedido</p></div><div class="container"><div class="form-container">
<form th:action="${pedido.idPedido == null} ? @{/pedido/salvar} : @{/pedido/atualizar/{id}(id=${pedido.idPedido})}" method="post">
<div class="form-group"><label for="nomeCliente">Cliente:</label><input id="nomeCliente" name="nomeCliente" type="text" maxlength="100" th:value="${pedido.nomeCliente}" required></div>
<div class="form-group"><label for="dataPedido">Data:</label><input id="dataPedido" name="dataPedido" type="date" th:value="${pedido.dataPedido}" required></div>
<div class="form-group"><label for="status">Status:</label><select id="status" name="status" required><option value="PENDENTE" th:selected="${pedido.status == null or pedido.status == 'PENDENTE'}">Pendente</option><option value="PAGO" th:selected="${pedido.status == 'PAGO'}">Pago</option><option value="ENVIADO" th:selected="${pedido.status == 'ENVIADO'}">Enviado</option><option value="ENTREGUE" th:selected="${pedido.status == 'ENTREGUE'}">Entregue</option><option value="CANCELADO" th:selected="${pedido.status == 'CANCELADO'}">Cancelado</option></select></div>
<div class="form-actions"><button class="btn btn-success" type="submit" th:text="${pedido.idPedido == null ? 'Salvar e adicionar itens' : 'Atualizar'}"></button><a class="btn btn-secondary" href="/pedido/listar">Cancelar</a></div></form></div></div></body></html>
