<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Alunos')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('alunos')}"></aside>

    <main class="main">
        <div class="content">
            <div class="page-head">
                <div>
                    <h1>Alunos</h1>
                    <p>Visualize, edite e gerencie os alunos cadastrados.</p>
                </div>
                <a class="btn btn-primary" th:href="@{/aluno/formulario}">Novo aluno</a>
            </div>

            <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

            <section class="card">
                <div class="table-wrap" th:unless="${#lists.isEmpty(alunos)}">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Aluno</th>
                            <th>RA</th>
                            <th>CPF</th>
                            <th>Telefone</th>
                            <th>Curso</th>
                            <th class="actions">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="aluno : ${alunos}">
                            <td>
                                <div class="cell-main" th:text="${aluno.nomeAluno}">Nome</div>
                                <div class="cell-sub" th:text="${aluno.emailAluno}">email@email.com</div>
                            </td>
                            <td th:text="${aluno.raAluno}">0000</td>
                            <td th:text="${aluno.cpfAluno}">000.000.000-00</td>
                            <td th:text="${aluno.telefoneAluno}">(00) 00000-0000</td>
                            <td>
                                <span class="badge badge-primary" th:if="${aluno.curso != null}" th:text="${aluno.curso.nomeCurso}">Curso</span>
                                <span class="text-muted" th:unless="${aluno.curso != null}">Sem curso</span>
                            </td>
                            <td class="actions">
                                <div class="actions-group">
                                    <a class="btn btn-ghost btn-sm" th:href="@{/aluno/editar/{id}(id=${aluno.idAluno})}">Editar</a>
                                    <form th:action="@{/aluno/deletar/{id}(id=${aluno.idAluno})}" method="post"
                                          th:attr="data-confirm='Excluir o aluno ' + ${aluno.nomeAluno} + '?'">
                                        <button type="submit" class="btn btn-ghost-danger btn-sm">Excluir</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="empty-state" th:if="${#lists.isEmpty(alunos)}">
                    <strong>Nenhum aluno cadastrado</strong>
                    Comece cadastrando o primeiro aluno.
                    <div><a class="btn btn-primary" th:href="@{/aluno/formulario}">Novo aluno</a></div>
                </div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
