<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Itens do Pedido</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <nav>
        <div class="nav-container">
            <div class="logo">Sistema DevOps</div>
            <ul class="nav-links">
                <li><a href="/home">Início</a></li>
                <li><a href="/produto/listar">Produtos</a></li>
                <li><a href="/pedido/listar">Pedidos</a></li>
            </ul>
        </div>
    </nav>
    <div class="page-header">
        <h1 th:text="${'Itens do Pedido #' + pedido.idPedido}"></h1>
        <p
            th:text="${pedido.aluno != null ? 'Aluno: ' + pedido.aluno.nomeAluno + ' - RA: ' + pedido.aluno.raAluno : 'Cliente: ' + pedido.nomeCliente}">
        </p>
    </div>
    <div class="container">
        <div class="alerta" th:if="${mensagem}" th:text="${mensagem}"></div>
        <div class="form-container">
            <form action="/item-pedido/salvar" method="post"><input type="hidden" name="pedidoId"
                    th:value="${pedido.idPedido}">
                <h2 class="form-title">Adicionar Item</h2>
                <div class="form-group"><label for="produtoId">Produto:</label><select id="produtoId" name="produtoId"
                        required>
                        <option value="">Selecione</option>
                        <option th:each="produto : ${produtos}" th:value="${produto.idProduto}"
                            th:text="${produto.nomeProduto + ' - R$ ' + #numbers.formatDecimal(produto.precoProduto,1,2)}">
                        </option>
                    </select></div>
                <div class="form-group"><label for="quantidade">Quantidade:</label><input id="quantidade"
                        name="quantidade" type="number" min="1" value="1" required></div>
                <div class="form-actions"><button class="btn btn-success" type="submit">Adicionar item</button></div>
            </form>
        </div>
        <div class="table-container">
            <div class="table-header">
                <h2>Itens cadastrados</h2><strong
                    th:text="${'Total: ' + #numbers.formatCurrency(pedido.valorTotal)}"></strong>
            </div>
            <div style="overflow-x:auto">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Preço unitário</th>
                            <th>Subtotal</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${itens}">
                            <td th:text="${item.idItemDoPedido}"></td>
                            <td th:text="${item.produto.nomeProduto}"></td>
                            <td th:text="${item.quantidade}"></td>
                            <td th:text="${#numbers.formatCurrency(item.precoUnitario)}"></td>
                            <td th:text="${#numbers.formatCurrency(item.subtotal)}"></td>
                            <td>
                                <div class="acoes"><a class="btn btn-small btn-info"
                                        th:href="@{/item-pedido/editar/{id}(id=${item.idItemDoPedido})}">Editar</a><a
                                        class="btn btn-small btn-danger"
                                        th:href="@{/item-pedido/deletar/{id}/{pedidoId}(id=${item.idItemDoPedido},pedidoId=${pedido.idPedido})}"
                                        onclick="return confirm('Remover este item?')">Remover</a></div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(itens)}">
                            <td colspan="6">Nenhum item adicionado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="text-center mt-3"><a class="btn btn-secondary" href="/pedido/listar">Concluir</a></div>
    </div>
</body>

</html>
