<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${disciplina.idDisciplina == null ? 'Nova disciplina' : 'Editar disciplina'})}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('disciplinas')}"></aside>

    <main class="main">
        <div class="content">
            <div class="page-head">
                <div>
                    <div class="breadcrumb"><a th:href="@{/disciplina/listar}">Disciplinas</a><span>/</span></div>
                    <h1 th:text="${disciplina.idDisciplina == null ? 'Nova disciplina' : 'Editar disciplina'}">Nova disciplina</h1>
                    <p>Campos marcados com * são obrigatórios.</p>
                </div>
            </div>

            <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

            <form class="card form-card" th:object="${disciplina}" method="post" novalidate
                  th:action="${disciplina.idDisciplina == null} ? @{/disciplina/salvar} : @{/disciplina/atualizar/{id}(id=${disciplina.idDisciplina})}">
                <div class="card-body form-grid">
                    <div class="form-group full">
                        <label class="required" for="nomeDisciplina">Nome da disciplina</label>
                        <input class="form-control" type="text" th:field="*{nomeDisciplina}" th:errorclass="is-invalid"
                               maxlength="100" placeholder="Ex: Programação Orientada a Objetos" required>
                        <small class="field-error" th:errors="*{nomeDisciplina}"></small>
                    </div>

                    <div class="form-group">
                        <label class="required" for="siglaDisciplina">Sigla</label>
                        <input class="form-control" type="text" th:field="*{siglaDisciplina}" th:errorclass="is-invalid"
                               maxlength="10" placeholder="Ex: POO" required>
                        <small class="field-error" th:errors="*{siglaDisciplina}"></small>
                    </div>

                    <div class="form-group">
                        <label class="required" for="cargaHorariaDisciplina">Carga horária (horas)</label>
                        <input class="form-control" type="number" min="1" th:field="*{cargaHorariaDisciplina}"
                               th:errorclass="is-invalid" placeholder="Ex: 80" required>
                        <small class="field-error" th:errors="*{cargaHorariaDisciplina}"></small>
                    </div>

                    <div class="form-group">
                        <label class="required" for="cursoId">Curso</label>
                        <select class="form-control" id="cursoId" name="cursoId" required>
                            <option value="">Selecione um curso</option>
                            <option th:each="curso : ${cursos}" th:value="${curso.idCurso}" th:text="${curso.nomeCurso}"
                                    th:selected="${curso.idCurso == cursoId}">Curso</option>
                        </select>
                        <small class="form-hint" th:if="${#lists.isEmpty(cursos)}">
                            Nenhum curso cadastrado. <a th:href="@{/curso/formulario}">Cadastrar curso</a>
                        </small>
                    </div>

                    <div class="form-group">
                        <label class="required" for="professorId">Professor</label>
                        <select class="form-control" id="professorId" name="professorId" required>
                            <option value="">Selecione um professor</option>
                            <option th:each="professor : ${professores}" th:value="${professor.idProfessor}"
                                    th:text="${professor.nomeProfessor}"
                                    th:selected="${professor.idProfessor == professorId}">Professor</option>
                        </select>
                        <small class="form-hint" th:if="${#lists.isEmpty(professores)}">
                            Nenhum professor cadastrado. <a th:href="@{/professor/formulario}">Cadastrar professor</a>
                        </small>
                    </div>
                </div>

                <div class="card-footer">
                    <a class="btn btn-secondary" th:href="@{/disciplina/listar}">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar disciplina</button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
