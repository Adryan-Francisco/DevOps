<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${curso.idCurso == null ? 'Novo curso' : 'Editar curso'})}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('cursos')}"></aside>

    <main class="main">
        <div class="content">
            <div class="page-head">
                <div>
                    <div class="breadcrumb"><a th:href="@{/curso/listar}">Cursos</a><span>/</span></div>
                    <h1 th:text="${curso.idCurso == null ? 'Novo curso' : 'Editar curso'}">Novo curso</h1>
                    <p>Campos marcados com * são obrigatórios.</p>
                </div>
            </div>

            <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

            <form class="card form-card" th:object="${curso}" method="post" novalidate
                  th:action="${curso.idCurso == null} ? @{/curso/salvar} : @{/curso/atualizar/{id}(id=${curso.idCurso})}">
                <div class="card-body form-grid">
                    <div class="form-group full">
                        <label class="required" for="nomeCurso">Nome do curso</label>
                        <input class="form-control" type="text" th:field="*{nomeCurso}" th:errorclass="is-invalid"
                               maxlength="40" placeholder="Ex: Desenvolvimento de Software" required>
                        <small class="field-error" th:errors="*{nomeCurso}"></small>
                    </div>

                    <div class="form-group">
                        <label class="required" for="periodoCurso">Período</label>
                        <input class="form-control" type="text" th:field="*{periodoCurso}" th:errorclass="is-invalid"
                               maxlength="40" list="periodos" placeholder="Selecione ou digite" required>
                        <datalist id="periodos">
                            <option value="Matutino"></option>
                            <option value="Vespertino"></option>
                            <option value="Noturno"></option>
                            <option value="Integral"></option>
                            <option value="EAD"></option>
                        </datalist>
                        <small class="field-error" th:errors="*{periodoCurso}"></small>
                    </div>

                    <div class="form-group">
                        <label class="required" for="cargahorariaCurso">Carga horária total (horas)</label>
                        <input class="form-control" type="number" min="1" th:field="*{cargahorariaCurso}"
                               th:errorclass="is-invalid" placeholder="Ex: 2400" required>
                        <small class="field-error" th:errors="*{cargahorariaCurso}"></small>
                    </div>
                </div>

                <div class="card-footer">
                    <a class="btn btn-secondary" th:href="@{/curso/listar}">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar curso</button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
