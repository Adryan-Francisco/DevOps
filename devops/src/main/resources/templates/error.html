<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body class="auth-page">
<main class="auth-layout">
    <section class="auth-panel text-center">
        <div class="error-code" th:text="${status}">500</div>
        <h1 class="error-title"
            th:text="${status == 404 ? 'Página não encontrada' : (status == 403 ? 'Acesso negado' : 'Algo deu errado')}">
            Algo deu errado</h1>
        <p class="text-muted"
           th:text="${status == 404 ? 'O endereço acessado não existe ou foi removido.' : (status == 403 ? 'Você não tem permissão para acessar esta página.' : 'Ocorreu um erro inesperado. Tente novamente em instantes.')}">
            Ocorreu um erro inesperado.</p>
        <div class="mt-2">
            <a th:href="@{/home}" class="btn btn-primary">Voltar para o início</a>
        </div>
    </section>
</main>
</body>
</html>
