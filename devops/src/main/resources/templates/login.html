<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body class="auth-page">
<main class="auth-layout">
    <section class="auth-panel">
        <div class="auth-brand">
            <div class="brand"><span class="brand-mark">D</span> Sistema DevOps</div>
            <h1>Acessar o sistema</h1>
            <p>Entre com seu usuário e senha para continuar.</p>
        </div>

        <form class="auth-form" th:action="@{/login}" method="post">
            <div class="alert alert-error" role="alert" th:if="${param.error}">
                Login ou senha inválidos. Tente novamente.
            </div>
            <div class="alert alert-success" role="status" th:if="${param.logout}">
                Você saiu do sistema com segurança.
            </div>
            <div class="alert alert-success" role="status" th:if="${mensagemSucesso}" th:text="${mensagemSucesso}"></div>

            <div class="form-group">
                <label for="username">Usuário</label>
                <input class="form-control" type="text" id="username" name="username"
                       placeholder="Digite seu usuário" autocomplete="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input class="form-control" type="password" id="password" name="password"
                       placeholder="Digite sua senha" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Entrar</button>

            <div class="auth-links">
                <a th:href="@{/recuperar-senha}">Esqueceu sua senha?</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
