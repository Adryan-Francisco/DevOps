<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Produtos')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('produtos')}"></aside>

    <main class="main">
        <div class="content">
            <div class="page-head">
                <div>
                    <h1>Produtos</h1>
                    <p>Gerencie o catálogo e o estoque da loja.</p>
                </div>
                <a class="btn btn-primary" th:href="@{/produto/formulario}">Novo produto</a>
            </div>

            <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

            <section class="card">
                <div class="table-wrap" th:unless="${#lists.isEmpty(produtos)}">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Produto</th>
                            <th class="num">Preço</th>
                            <th class="num">Estoque</th>
                            <th class="actions">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="produto : ${produtos}">
                            <td>
                                <div class="product-cell">
                                    <img th:if="${produto.foto != null}" class="thumb"
                                         th:src="@{/produto/foto/{id}(id=${produto.idProduto})}"
                                         th:alt="${'Foto de ' + produto.nomeProduto}">
                                    <span th:unless="${produto.foto != null}" class="thumb-empty">Sem foto</span>
                                    <div>
                                        <div class="cell-main" th:text="${produto.nomeProduto}">Nome</div>
                                        <div class="cell-sub cell-truncate" th:text="${produto.descricaoProduto}"
                                             th:title="${produto.descricaoProduto}">Descrição</div>
                                    </div>
                                </div>
                            </td>
                            <td class="num" th:text="${#numbers.formatCurrency(produto.precoProduto)}">R$ 0,00</td>
                            <td class="num">
                                <span class="badge"
                                      th:classappend="${produto.quantidadeEstoque == 0} ? 'badge-danger' : (${produto.quantidadeEstoque <= 5} ? 'badge-warning' : 'badge-success')"
                                      th:text="${produto.quantidadeEstoque == 0 ? 'Esgotado' : produto.quantidadeEstoque + ' un.'}">10 un.</span>
                            </td>
                            <td class="actions">
                                <div class="actions-group">
                                    <a class="btn btn-ghost btn-sm" th:href="@{/produto/editar/{id}(id=${produto.idProduto})}">Editar</a>
                                    <form th:action="@{/produto/deletar/{id}(id=${produto.idProduto})}" method="post"
                                          th:attr="data-confirm='Excluir o produto ' + ${produto.nomeProduto} + '?'">
                                        <button type="submit" class="btn btn-ghost-danger btn-sm">Excluir</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="empty-state" th:if="${#lists.isEmpty(produtos)}">
                    <strong>Nenhum produto cadastrado</strong>
                    Cadastre produtos para poder adicioná-los aos pedidos.
                    <div><a class="btn btn-primary" th:href="@{/produto/formulario}">Novo produto</a></div>
                </div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
