<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <nav>
        <div class="nav-container">
            <div class="logo">Sistema DevOps</div>
            <ul class="nav-links">
                <li><a href="/home">Início</a></li>
                <li><a href="/produto/listar">Produtos</a></li>
                <li><a href="/pedido/listar">Pedidos</a></li>
            </ul>
        </div>
    </nav>
    <div class="page-header">
        <h1>Produtos</h1>
        <p>Gerencie o catálogo e o estoque</p>
    </div>
    <div class="container">
        <div class="alerta" th:if="${mensagem}" th:text="${mensagem}"></div>
        <div class="alerta" th:if="${erro}" th:text="${erro}"></div>
        <div class="table-container">
            <div class="table-header">
                <h2>Lista de Produtos</h2><a class="btn btn-primary" href="/produto/formulario">Novo Produto</a>
            </div>
            <div style="overflow-x:auto">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="produto : ${produtos}">
                            <td th:text="${produto.idProduto}"></td>
                            <td th:text="${produto.nomeProduto}"></td>
                            <td th:text="${produto.descricaoProduto}"></td>
                            <td th:text="${#numbers.formatCurrency(produto.precoProduto)}"></td>
                            <td th:text="${produto.quantidadeEstoque}"></td>
                            <td>
                                <div class="acoes"><a class="btn btn-small btn-info"
                                        th:href="@{/produto/editar/{id}(id=${produto.idProduto})}">Editar</a><a
                                        class="btn btn-small btn-danger"
                                        th:href="@{/produto/deletar/{id}(id=${produto.idProduto})}"
                                        onclick="return confirm('Tem certeza que deseja deletar?')">Deletar</a></div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(produtos)}">
                            <td colspan="6">Nenhum produto cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
