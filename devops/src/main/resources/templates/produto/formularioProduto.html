<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${produto.idProduto == null ? 'Novo produto' : 'Editar produto'})}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('produtos')}"></aside>

    <main class="main">
        <div class="content">
            <div class="page-head">
                <div>
                    <div class="breadcrumb"><a th:href="@{/produto/listar}">Produtos</a><span>/</span></div>
                    <h1 th:text="${produto.idProduto == null ? 'Novo produto' : 'Editar produto'}">Novo produto</h1>
                    <p>Campos marcados com * são obrigatórios.</p>
                </div>
            </div>

            <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

            <form class="card form-card" th:object="${produto}" method="post" enctype="multipart/form-data" novalidate
                  th:action="${produto.idProduto == null} ? @{/produto/salvar} : @{/produto/atualizar/{id}(id=${produto.idProduto})}">
                <div class="card-body form-grid">
                    <div class="form-group full">
                        <label class="required" for="nomeProduto">Nome</label>
                        <input class="form-control" type="text" th:field="*{nomeProduto}" th:errorclass="is-invalid"
                               maxlength="100" placeholder="Ex: Caneca personalizada" required>
                        <small class="field-error" th:errors="*{nomeProduto}"></small>
                    </div>

                    <div class="form-group full">
                        <label class="required" for="descricaoProduto">Descrição</label>
                        <textarea class="form-control" th:field="*{descricaoProduto}" th:errorclass="is-invalid"
                                  maxlength="255" placeholder="Descreva o produto" required></textarea>
                        <small class="field-error" th:errors="*{descricaoProduto}"></small>
                    </div>

                    <div class="form-group">
                        <label class="required" for="precoProduto">Preço (R$)</label>
                        <input class="form-control" type="number" min="0.01" step="0.01" th:field="*{precoProduto}"
                               th:errorclass="is-invalid" placeholder="0,00" required>
                        <small class="field-error" th:errors="*{precoProduto}"></small>
                    </div>

                    <div class="form-group">
                        <label class="required" for="quantidadeEstoque">Quantidade em estoque</label>
                        <input class="form-control" type="number" min="0" th:field="*{quantidadeEstoque}"
                               th:errorclass="is-invalid" placeholder="0" required>
                        <small class="field-error" th:errors="*{quantidadeEstoque}"></small>
                    </div>

                    <div class="form-group full">
                        <label for="fotoArquivo">Foto</label>
                        <input class="form-control" id="fotoArquivo" name="fotoArquivo" type="file"
                               accept="image/jpeg,image/png,image/gif,image/webp">
                        <small class="form-hint">JPG, PNG, GIF ou WEBP com até 5 MB.
                            <span th:if="${produto.foto != null}">Envie uma nova foto apenas se quiser substituir a atual.</span>
                        </small>
                        <div th:if="${produto.foto != null}" class="foto-atual">
                            <img th:src="@{/produto/foto/{id}(id=${produto.idProduto})}"
                                 th:alt="${'Foto de ' + produto.nomeProduto}">
                            <span>Foto atual</span>
                        </div>
                    </div>
                </div>

                <div class="card-footer">
                    <a class="btn btn-secondary" th:href="@{/produto/listar}">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar produto</button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
