<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <nav>
        <div class="nav-container">
            <div class="logo">Sistema DevOps</div>
            <ul class="nav-links">
                <li><a href="/home">Início</a></li>
                <li><a href="/produto/listar">Produtos</a></li>
                <li><a href="/pedido/listar">Pedidos</a></li>
            </ul>
        </div>
    </nav>
    <div class="page-header">
        <h1 th:text="${produto.idProduto == null ? 'Novo Produto' : 'Editar Produto'}"></h1>
        <p>Preencha os dados do produto</p>
    </div>
    <div class="container">
        <div class="alerta" th:if="${erro}" th:text="${erro}"></div>
        <div class="form-container">
            <form
                th:action="${produto.idProduto == null} ? @{/produto/salvar} : @{/produto/atualizar/{id}(id=${produto.idProduto})}"
                method="post" enctype="multipart/form-data">
                <div class="form-group"><label for="nomeProduto">Nome:</label><input id="nomeProduto" name="nomeProduto"
                        type="text" th:value="${produto.nomeProduto}" maxlength="100" required></div>
                <div class="form-group"><label for="descricaoProduto">Descrição:</label><textarea id="descricaoProduto"
                        name="descricaoProduto" maxlength="255" required
                        th:text="${produto.descricaoProduto}"></textarea></div>
                <div class="form-group"><label for="precoProduto">Preço (R$):</label><input id="precoProduto"
                        name="precoProduto" type="number" min="0.01" step="0.01" th:value="${produto.precoProduto}"
                        required></div>
                <div class="form-group"><label for="quantidadeEstoque">Quantidade em estoque:</label><input
                        id="quantidadeEstoque" name="quantidadeEstoque" type="number" min="0"
                        th:value="${produto.quantidadeEstoque}" required></div>
                <div class="form-group">
                    <label for="fotoArquivo">Foto:</label>
                    <input id="fotoArquivo" name="fotoArquivo" type="file"
                        accept="image/jpeg,image/png,image/gif,image/webp">
                    <small>Formatos permitidos: JPG, PNG, GIF ou WEBP. Tamanho máximo: 5 MB.</small>
                    <div th:if="${produto.foto != null}" class="foto-atual">
                        <span>Foto atual:</span>
                        <img th:src="@{/produto/foto/{id}(id=${produto.idProduto})}"
                            th:alt="${'Foto de ' + produto.nomeProduto}">
                        <small th:text="${produto.tipoFoto}"></small>
                    </div>
                </div>
                <div class="form-actions"><button class="btn btn-success" type="submit"
                        th:text="${produto.idProduto == null ? 'Salvar' : 'Atualizar'}"></button><a
                        class="btn btn-secondary" href="/produto/listar">Cancelar</a></div>
            </form>
        </div>
    </div>
</body>

</html>
