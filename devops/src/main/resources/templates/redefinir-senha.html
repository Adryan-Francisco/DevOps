<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Redefinir senha')}"></head>
<body class="auth-page">
<main class="auth-layout">
    <section class="auth-panel">
        <div class="auth-brand">
            <div class="brand"><span class="brand-mark">D</span> Sistema DevOps</div>
            <h1>Redefinir senha</h1>
            <p>Crie uma nova senha com pelo menos 6 caracteres.</p>
        </div>

        <form class="auth-form" th:action="@{/redefinir-senha}" method="post">
            <div class="alert alert-success" role="status" th:if="${mensagemSucesso}" th:text="${mensagemSucesso}"></div>
            <div class="alert alert-error" role="alert" th:if="${mensagemErro}" th:text="${mensagemErro}"></div>

            <input type="hidden" name="token" th:value="${token}">

            <div class="form-group">
                <label for="novaSenha">Nova senha</label>
                <input class="form-control" type="password" id="novaSenha" name="novaSenha"
                       autocomplete="new-password" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmaSenha">Confirmar senha</label>
                <input class="form-control" type="password" id="confirmaSenha" name="confirmaSenha"
                       autocomplete="new-password" required minlength="6">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Redefinir senha</button>

            <div class="auth-links">
                <a th:href="@{/login}">Voltar para o login</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
